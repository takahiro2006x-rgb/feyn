<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feyn - 学習のきろく</title>
  <script>
    // ちらつき防止のため、描画前に保存済みテーマを適用する
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('feynTheme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #F0F4F8;
      --card:     #FFFFFF;
      --border:   #E5E5E5;
      --text:     #3C3C3C;
      --subtext:  #AFAFAF;
      --green:    #58CC02;
      --green-dark: #46A302;
      --bubble:   #F0F4F8;
    }

    [data-theme="dark"] {
      --bg:       #0D1117;
      --card:     #161B22;
      --border:   #30363D;
      --text:     #E2E8F0;
      --subtext:  #6E7681;
      --bubble:   #0D1117;
    }

    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ===== ヘッダー ===== */
    .header {
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo { font-size: 22px; font-weight: 800; color: var(--green); letter-spacing: 2px; }
    .header-divider { width: 2px; height: 24px; background: var(--border); }
    .header-title { font-size: 16px; font-weight: 800; color: var(--text); flex: 1; }
    .header-right { display: flex; align-items: center; gap: 12px; }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--subtext);
      font-size: 13px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { border-color: var(--green); color: var(--green); }

    /* ===== コンテンツ ===== */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-desc {
      font-size: 14px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* ===== セッションカード（アコーディオン） ===== */
    .session-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 0 var(--border);
    }

    .session-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }
    .session-head:hover { background: var(--bubble); }

    .session-emoji { font-size: 24px; }
    .session-info  { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .session-subject { font-size: 15px; font-weight: 800; }
    .session-meta  { font-size: 12px; font-weight: 700; color: var(--subtext); }

    .session-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
      background: var(--bubble);
      border: 2px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
      white-space: nowrap;
    }

    .session-arrow { font-size: 13px; color: var(--subtext); transition: transform 0.2s; }
    .session-card.open .session-arrow { transform: rotate(90deg); }

    .status-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
      background: #FF9600;
      color: white;
    }

    .resume-btn {
      align-self: flex-start;
      padding: 10px 20px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--green-dark);
      transition: all 0.1s;
    }
    .resume-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .session-body {
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 4px 20px 20px;
      border-top: 2px solid var(--border);
      padding-top: 18px;
    }
    .session-card.open .session-body { display: flex; }

    /* ===== 吹き出し ===== */
    .msg { display: flex; max-width: 85%; }
    .msg.feyn { align-self: flex-start; }
    .msg.user { align-self: flex-end; }

    .msg .bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.7;
      font-weight: 700;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.feyn .bubble {
      background: var(--bubble);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 4px 16px 16px 16px;
    }

    .msg.user .bubble {
      background: var(--green);
      color: white;
      border-radius: 16px 4px 16px 16px;
      box-shadow: 0 3px 0 var(--green-dark);
    }

    /* ===== 空状態 ===== */
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
    }
    .empty-emoji { font-size: 48px; }
    .empty-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .empty-desc  { font-size: 14px; font-weight: 700; color: var(--subtext); }

    .loading {
      padding: 64px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--subtext);
    }

    @media (max-width: 600px) {
      .header { padding: 0 16px; }
      .container { padding: 16px; }
      .msg { max-width: 100%; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">🎓 Feyn</div>
    <div class="header-divider"></div>
    <div class="header-title">📚 学習のきろく</div>
    <div class="header-right">
      <button class="btn" id="themeToggle">🌙 ダークモード</button>
      <a href="/" class="btn">← アプリへ戻る</a>
    </div>
  </header>

  <div class="container">
    <div class="page-desc">Feynに説明した内容を見返して、理解を深めよう！</div>
    <div id="content"><div class="loading">読み込み中...</div></div>
  </div>

  <script>
    // ===== テーマ切り替え =====
    const themeToggle = document.getElementById('themeToggle');

    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeToggle.textContent = isDark ? '☀️ ライトモード' : '🌙 ダークモード';
    }
    updateThemeLabel();

    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('feynTheme', next);
      updateThemeLabel();
    });

    // ===== 履歴の描画 =====
    const SUBJECT_EMOJIS = { '物理':'⚡', '数学':'📐', '英語':'🌍', '化学':'⚗️', '生物':'🌿', '国語':'📖', '歴史':'🏛️' };

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function init() {
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('/api/history');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();

        if (!data.sessions || data.sessions.length === 0) {
          contentEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-emoji">📭</div>
              <div class="empty-title">まだ学習のきろくがありません</div>
              <div class="empty-desc">Feynと会話すると、ここに残っていきます</div>
            </div>
          `;
          return;
        }

        contentEl.innerHTML = '';
        contentEl.style.display = 'flex';
        contentEl.style.flexDirection = 'column';
        contentEl.style.gap = '16px';

        data.sessions.forEach(s => {
          const emoji = SUBJECT_EMOJIS[s.subject] || '📚';
          const card = document.createElement('div');
          card.className = 'session-card';

          const bubbles = s.messages.map(m => `
            <div class="msg ${m.role === 'user' ? 'user' : 'feyn'}">
              <div class="bubble">${escHtml(m.message)}</div>
            </div>
          `).join('');

          const badge = s.completed ? '' : `<span class="status-badge">⏸ 中断中</span>`;
          const resumeBtn = s.completed ? '' : `<button class="resume-btn" data-subject="${escHtml(s.subject)}" data-date="${escHtml(s.date)}">▶️ 続きから再開する</button>`;

          card.innerHTML = `
            <button class="session-head">
              <span class="session-emoji">${emoji}</span>
              <span class="session-info">
                <span class="session-subject">${escHtml(s.subject)}</span>
                <span class="session-meta">${escHtml(s.date)} ・ ${escHtml(s.difficulty)}</span>
              </span>
              ${badge}
              <span class="session-count">💬 ${s.messages.length}</span>
              <span class="session-arrow">▶</span>
            </button>
            <div class="session-body">${bubbles}${resumeBtn}</div>
          `;

          card.querySelector('.session-head').addEventListener('click', () => {
            card.classList.toggle('open');
          });

          const resumeButtonEl = card.querySelector('.resume-btn');
          if (resumeButtonEl) {
            resumeButtonEl.addEventListener('click', (e) => {
              e.stopPropagation();
              const subject = resumeButtonEl.dataset.subject;
              const date    = resumeButtonEl.dataset.date;
              window.location.href = `/?resume=${encodeURIComponent(subject)}&date=${encodeURIComponent(date)}`;
            });
          }

          contentEl.appendChild(card);
        });
      } catch (e) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji">⚠️</div>
            <div class="empty-title">読み込みに失敗しました</div>
            <div class="empty-desc">ページを再読み込みしてください</div>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
