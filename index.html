<!DOCTYPE html>
<html lang="ja" translate="no" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feyn - ファインマン学習アプリ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131A16" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feyn">
  <script>
    // ちらつき防止のため、描画前に保存済みテーマを適用する
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('feynTheme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    // 100vh/100dvhがブラウザによって実際のウィンドウ高さとズレて下に余白が残ることがあるため、
    // JSで実測した高さをCSS変数として持たせて確実に一致させる。
    // iOSのソフトキーボード開閉はwindowのresizeではなくvisualViewportのresizeで通知されることが
    // 多いため、両方を監視する。
    function setAppHeight() {
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    window.addEventListener('pageshow', setAppHeight);
    document.addEventListener('visibilitychange', setAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
    }
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://unpkg.com/mathlive"></script>
</head>
<body>

  <div class="app">

    <!-- ===== サイドバー（PCは左の列。スマホは上の1段＋メニュー） ===== -->
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="/landing" aria-label="Feyn トップ">
        <span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5L12 14z" fill="#FFFFFF"/><path d="M6.5 11.6V16c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.4L12 14z" fill="#FFFFFF"/></svg></span><span class="logo-text">Feyn</span>
      </a>

      <p class="section-label" id="subjectLabel">科目</p>
      <nav class="subject-list" aria-labelledby="subjectLabel">
        <div class="subject active" data-subject="物理" role="button" tabindex="0" aria-current="true">物理</div>
        <div class="subject" data-subject="数学" role="button" tabindex="0">数学</div>
        <div class="subject" data-subject="英語" role="button" tabindex="0">英語</div>
        <div class="subject" data-subject="化学" role="button" tabindex="0">化学</div>
        <div class="subject" data-subject="生物" role="button" tabindex="0">生物</div>
        <div class="subject" data-subject="国語" role="button" tabindex="0">国語</div>
        <div class="subject" data-subject="歴史" role="button" tabindex="0">歴史</div>
      </nav>

      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sideMore" aria-label="メニュー">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="menu-dot" id="menuDot" hidden></span>
      </button>

      <div class="side-more" id="sideMore">
        <div class="side-record" aria-label="きろく">
          <div class="status-bar">
            <span class="status-item">連続 <strong id="streakCount">0</strong> 日</span>
            <span class="status-item"><strong id="xpCount">0</strong> XP</span>
          </div>
          <div class="level-badge" id="levelBadge"></div>
          <div class="stats-display" id="statsDisplay"></div>
        </div>

        <details class="side-settings">
          <summary>設定</summary>
          <div class="settings">
            <label for="teacherName">ニックネーム</label>
            <input type="text" id="teacherName" value="" />
            <label for="difficulty">試験の種類</label>
            <select id="difficulty">
              <option>大学受験</option>
              <option>高校受験</option>
              <option>中学受験</option>
              <option>定期テスト</option>
              <option>大学試験</option>
            </select>
          </div>
        </details>

        <div class="side-actions">
          <button class="reset-btn side-btn" type="button">やり直す</button>
          <button class="theme-toggle side-btn" id="themeToggle" type="button">ダークモード</button>
        </div>

        <div class="user-info">
          <div id="userDisplay" class="user-name-display"></div>
          <button class="logout-btn side-btn" id="guideBtn" type="button">使い方</button>
          <button class="logout-btn side-btn" id="mypageBtn" type="button">マイページ</button>
          <button class="logout-btn side-btn" id="securityBtn" type="button" style="display:none">秘密の質問を設定</button>
          <button class="logout-btn side-btn" id="logoutBtn" type="button">ログアウト</button>
        </div>
      </div>

      <!-- 秘密の質問設定モーダル -->
      <div id="securityModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="sqTitle">
        <div class="modal-card">
          <div class="modal-title" id="sqTitle">秘密の質問を設定</div>
          <div class="modal-text">パスワードを忘れたときに使います</div>
          <select id="sqSelect" class="field" aria-label="秘密の質問">
            <option value="">-- 質問を選んでください --</option>
            <option>小学校の名前は？</option>
            <option>初めて飼ったペットの名前は？</option>
            <option>好きな食べ物は？</option>
            <option>生まれた市区町村は？</option>
            <option>母親の旧姓は？</option>
          </select>
          <input type="text" id="sqAnswer" class="field" placeholder="答え" aria-label="答え">
          <div id="sqError" class="modal-error" role="alert"></div>
          <button id="sqSave" class="btn-primary" type="button">保存する</button>
          <button id="sqClose" class="btn-secondary" type="button">キャンセル</button>
        </div>
      </div>
    </aside>

    <!-- ===== 使い方ガイド（初回登録後に3枚のカードで表示。内容はscript.jsのONBOARDING_STEPS） ===== -->
    <div class="onboarding-overlay" id="onboardingOverlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
      <div class="onboarding-card">
        <div class="onboarding-emoji" id="onboardingEmoji"></div>
        <div class="onboarding-title" id="onboardingTitle"></div>
        <div class="onboarding-text" id="onboardingText"></div>
        <div class="onboarding-dots" id="onboardingDots"></div>
        <div class="onboarding-actions">
          <button class="onboarding-skip" id="onboardingSkip" type="button">スキップ</button>
          <button class="onboarding-next" id="onboardingNext" type="button">次へ</button>
        </div>
      </div>
    </div>

    <!-- ===== 会話終了後の結果画面（/api/complete の分析結果をカードで見せる。中身はscript.jsのshowResult） ===== -->
    <div class="result-overlay" id="resultOverlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="result-card" id="resultCard"></div>
    </div>

    <!-- ===== チャット ===== -->
    <main class="chat-main">
      <!-- 会話の列の上の「欄外」: Feyn・納得度・ライフ -->
      <header class="chat-head">
        <div class="feyn-id">
          <span class="avatar avatar-lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5L12 14z" fill="#FFFFFF"/><path d="M6.5 11.6V16c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.4L12 14z" fill="#FFFFFF"/></svg></span>
          <div class="feyn-id-text">
            <div class="char-name">Feyn</div>
            <div class="char-meta"><span class="subject-badge" id="subjectBadge">物理</span><span class="char-role" id="charRole">物理を教わる生徒役</span></div>
          </div>
        </div>
        <div class="xp-area" id="xpArea">
          <div class="xp-label"><span>納得度</span><span class="xp-percent">0%</span></div>
          <div class="xp-bar" role="presentation">
            <div class="xp-fill" style="width: 0%;"></div>
            <div class="xp-stars" aria-hidden="true"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>
          </div>
        </div>
        <div id="livesDisplay" class="lives-display" style="display:none;"></div>
      <div class="char-illustration" hidden>
        <svg width="200" height="230" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="face-grad" cx="45%" cy="40%" r="55%">
              <stop offset="0%" stop-color="#FFE0B8"/>
              <stop offset="100%" stop-color="#FFCB94"/>
            </radialGradient>
            <radialGradient id="iris-l" cx="60%" cy="35%" r="60%">
              <stop id="irisL1" offset="0%" stop-color="#4F8EF7"/>
              <stop id="irisL2" offset="100%" stop-color="#1A3FAA"/>
            </radialGradient>
            <radialGradient id="iris-r" cx="60%" cy="35%" r="60%">
              <stop id="irisR1" offset="0%" stop-color="#4F8EF7"/>
              <stop id="irisR2" offset="100%" stop-color="#1A3FAA"/>
            </radialGradient>
          </defs>

          <ellipse id="feynHairBase" cx="100" cy="82" rx="70" ry="64" fill="#1A1A2E"/>
          <ellipse cx="32" cy="104" rx="12" ry="14" fill="#FFCB94"/>
          <ellipse cx="168" cy="104" rx="12" ry="14" fill="#FFCB94"/>
          <ellipse cx="100" cy="108" rx="62" ry="68" fill="url(#face-grad)"/>
          <ellipse cx="58" cy="126" rx="16" ry="10" fill="#FFB3C6" opacity="0.55"/>
          <ellipse cx="142" cy="126" rx="16" ry="10" fill="#FFB3C6" opacity="0.55"/>
          <path d="M 62 74 Q 76 69 90 74" fill="none" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 110 74 Q 124 69 138 74" fill="none" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="53" y="82" width="42" height="30" rx="10" fill="rgba(200,230,255,0.18)" stroke="#1A1A2E" stroke-width="3.5"/>
          <rect x="105" y="82" width="42" height="30" rx="10" fill="rgba(200,230,255,0.18)" stroke="#1A1A2E" stroke-width="3.5"/>
          <line x1="95" y1="97" x2="105" y2="97" stroke="#1A1A2E" stroke-width="3"/>
          <line x1="53" y1="95" x2="36" y2="93" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round"/>
          <line x1="147" y1="95" x2="164" y2="93" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="74" cy="97" rx="16" ry="14" fill="white"/>
          <circle cx="74" cy="98" r="10" fill="url(#iris-l)"/>
          <circle cx="74" cy="98" r="6" fill="#0A0A1A"/>
          <circle cx="78" cy="93" r="4" fill="white"/>
          <circle cx="69" cy="103" r="2" fill="white" opacity="0.75"/>
          <ellipse cx="126" cy="97" rx="16" ry="14" fill="white"/>
          <circle cx="126" cy="98" r="10" fill="url(#iris-r)"/>
          <circle cx="126" cy="98" r="6" fill="#0A0A1A"/>
          <circle cx="130" cy="93" r="4" fill="white"/>
          <circle cx="121" cy="103" r="2" fill="white" opacity="0.75"/>
          <path d="M 100 118 Q 96 124 100 126 Q 104 124 100 118" fill="none" stroke="#D4956A" stroke-width="2" stroke-linecap="round"/>
          <path id="feynMouth" d="M 84 140 Q 100 152 116 140" fill="none" stroke="#C07A50" stroke-width="2.8" stroke-linecap="round"/>
          <path id="feynHair1" d="M 34 100 Q 36 52 62 44 Q 64 74 56 100 Z" fill="#1A1A2E"/>
          <path id="feynHair2" d="M 62 44 Q 78 26 100 34 Q 94 64 80 90 Z" fill="#1A1A2E"/>
          <path id="feynHair3" d="M 100 34 Q 122 26 138 44 Q 118 64 110 88 Z" fill="#1A1A2E"/>
          <path id="feynHair4" d="M 138 44 Q 164 54 166 100 Q 148 76 140 56 Z" fill="#1A1A2E"/>
          <rect x="84" y="170" width="32" height="22" rx="10" fill="#FFCB94"/>
          <path d="M 36 192 Q 68 176 100 180 Q 132 176 164 192 L 174 230 L 26 230 Z" fill="white"/>
          <path d="M 36 192 Q 60 180 78 182 L 68 230 L 26 230 Z" fill="#E8ECF0"/>
          <path d="M 164 192 Q 140 180 122 182 L 132 230 L 174 230 Z" fill="#E8ECF0"/>
          <path d="M 100 178 L 84 198 L 100 194 L 116 198 Z" fill="#F8FAFC"/>
          <path id="feynTie"     d="M 100 195 L 92 218 L 100 224 L 108 218 Z" fill="#58CC02"/>
          <path id="feynTieTip"  d="M 92 218 L 100 224 L 108 218 L 100 230 Z" fill="#3EA801"/>
        </svg>
      </div>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Feynとの会話"></div>

      <div class="composer">
        <div class="help-row">
          <button class="help-btn" id="hintBtn" type="button" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>ヒント</button>
          <button class="help-btn" id="revealBtn" type="button" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>答えを見る</button>
        </div>
        <div class="input-area">
          <button class="math-btn icon-btn" id="mathBtn" type="button" title="数式を入力" aria-label="数式を入力"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h3l3 7 5-16h7"/></svg></button>
          <!-- 音声入力。ブラウザが対応しているときだけ script.js が表示する -->
          <button class="mic-btn icon-btn" id="micBtn" type="button" title="音声で入力" aria-label="音声で入力" aria-pressed="false" style="display:none;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <textarea placeholder="Feynに説明してみよう" aria-label="Feynへの説明"></textarea>
          <button class="send-btn" type="button" aria-label="送信"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg><span class="send-label">送信</span></button>
        </div>
      </div>
    </main>
  </div>

  <input type="file" id="photoUploadInput" accept="image/*" capture="environment" style="display:none;" aria-label="問題の写真を選ぶ">

  <!-- ===== 数式入力モーダル ===== -->
  <div class="math-modal-overlay" id="mathModalOverlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="mathModalTitle">
    <div class="math-modal">
      <div class="math-modal-title" id="mathModalTitle">数式を入力</div>
      <math-field id="mathField"></math-field>
      <div class="math-quick-row">
        <button type="button" data-insert="\frac{#0}{#0}">分数</button>
        <button type="button" data-insert="#0^{#0}">x²</button>
        <button type="button" data-insert="\sqrt{#0}">√</button>
        <button type="button" data-insert="#0_{#0}">添字</button>
        <button type="button" data-insert="\pi">π</button>
        <button type="button" data-insert="\theta">θ</button>
        <button type="button" data-insert="\infty">∞</button>
        <button type="button" data-insert="\times">×</button>
        <button type="button" data-insert="\div">÷</button>
        <button type="button" data-insert="\pm">±</button>
        <button type="button" data-insert="\leq">≤</button>
        <button type="button" data-insert="\geq">≥</button>
        <button type="button" data-insert="\sum_{#0}^{#0}">Σ</button>
        <button type="button" data-insert="\int_{#0}^{#0}">∫</button>
      </div>
      <div class="math-modal-hint">キーボードで「1/2」「x^2」のように打つと自動できれいに整形されます。ボタンでもよく使う記号を入力できます</div>
      <div class="math-modal-actions">
        <button class="math-modal-btn math-modal-cancel" id="mathCancelBtn" type="button">キャンセル</button>
        <button class="math-modal-btn math-modal-insert" id="mathInsertBtn" type="button">挿入する</button>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
