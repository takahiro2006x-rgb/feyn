<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feyn - 講師ダッシュボード</title>
  <script>
    // ちらつき防止のため、描画前に保存済みテーマを適用する
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('feynTheme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #F0F4F8;
      --card:        #FFFFFF;
      --border:      #E5E5E5;
      --text:        #3C3C3C;
      --subtext:     #AFAFAF;
      --green:       #58CC02;
      --green-dark:  #46A302;
      --blue:        #1CB0F6;
      --blue-dark:   #0891CC;
      --yellow:      #FFC200;
      --yellow-dark: #D4A200;
    }

    [data-theme="dark"] {
      --bg:          #0D1117;
      --card:        #161B22;
      --border:      #30363D;
      --text:        #E2E8F0;
      --subtext:     #6E7681;
    }

    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ===== ヘッダー ===== */
    .header {
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 2px;
    }

    .header-divider {
      width: 2px;
      height: 24px;
      background: var(--border);
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      flex: 1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-user {
      font-size: 13px;
      font-weight: 700;
      color: var(--subtext);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--subtext);
      font-size: 13px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { border-color: var(--green); color: var(--green); }
    .btn-danger:hover { border-color: #FF4B4B; color: #FF4B4B; background: rgba(255,75,75,0.06); }

    /* ===== コンテンツ ===== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== サマリーカード ===== */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .summary-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 0 var(--border);
    }

    .summary-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .summary-value.green  { color: var(--green); }
    .summary-value.blue   { color: var(--blue); }
    .summary-value.yellow { color: var(--yellow); }

    .summary-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* ===== テーブルセクション ===== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .student-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--subtext);
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
    }

    .table-wrap {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      overflow-x: auto;   /* スマホでは表を横スクロールできるようにする */
      box-shadow: 0 4px 0 var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--bg);
      border-bottom: 2px solid var(--border);
    }

    th {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
      text-align: center;
      white-space: nowrap;
    }

    th:first-child { text-align: left; }

    tbody tr {
      border-bottom: 2px solid var(--bg);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }

    td {
      padding: 16px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: var(--text);
    }

    td:first-child { text-align: left; }

    .td-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .td-name-main {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .td-name-email {
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
    }

    .count-badge {
      display: inline-block;
      min-width: 32px;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      background: var(--bg);
      color: var(--subtext);
      border: 2px solid var(--border);
    }

    .count-badge.lv1 { background: #f0fce8; color: #46A302; border-color: #b7eea0; }
    .count-badge.lv2 { background: #d4f5b0; color: #3a8c00; border-color: #7dd950; }
    .count-badge.lv3 { background: #58CC02; color: white;   border-color: #46A302; box-shadow: 0 2px 0 #46A302; }

    [data-theme="dark"] .count-badge.lv1 { background: #14260b; color: #7dd950; border-color: #2f5a1a; }
    [data-theme="dark"] .count-badge.lv2 { background: #1e3a0e; color: #a5e77d; border-color: #46A302; }

    .count-badge.total {
      background: var(--green);
      color: white;
      border-color: var(--green-dark);
      box-shadow: 0 3px 0 var(--green-dark);
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover { color: var(--green); }
    th.sort-asc::after  { content: ' ▲'; color: var(--green); }
    th.sort-desc::after { content: ' ▼'; color: var(--green); }

    .td-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* ===== 空状態 ===== */
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-emoji { font-size: 48px; }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .empty-desc {
      font-size: 14px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* ===== ローディング ===== */
    .loading {
      padding: 64px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--subtext);
    }

    /* ===== リセットボタン ===== */
    .reset-pass-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--subtext);
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .reset-pass-btn:hover { border-color: #FF4B4B; color: #FF4B4B; background: rgba(255,75,75,0.06); }

    .detail-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--subtext);
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .detail-btn:hover { border-color: var(--green); color: var(--green); }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }

    .modal {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .modal-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .modal-desc  { font-size: 14px; font-weight: 700; color: var(--subtext); line-height: 1.6; }

    /* ===== 生徒詳細モーダル ===== */
    .detail-modal {
      width: min(680px, 94vw);
      max-height: 85vh;
      overflow-y: auto;
    }

    .detail-section-title { font-size: 14px; font-weight: 800; color: var(--text); margin-top: 4px; }

    .d-progress-row { display: flex; align-items: center; gap: 10px; }
    .d-progress-name { flex: 1; font-size: 12px; font-weight: 800; min-width: 0; }
    .d-progress-name small { color: var(--subtext); font-weight: 700; }
    .d-progress-track {
      flex: 1.2; height: 10px; border-radius: 99px; overflow: hidden;
      background: var(--bg); border: 2px solid var(--border);
    }
    .d-progress-fill { height: 100%; border-radius: 99px; }
    .d-progress-score { width: 32px; text-align: right; font-size: 12px; font-weight: 800; color: var(--subtext); }

    .d-gap {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .d-gap.resolved { opacity: 0.55; }
    .d-gap-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .d-gap-topic { flex: 1; font-size: 13px; font-weight: 800; }
    .d-gap-type {
      font-size: 10px; font-weight: 800; padding: 3px 8px;
      border-radius: 99px; border: 2px solid; white-space: nowrap;
    }
    .d-type-misconception        { color: #FF4B4B; border-color: #FF4B4B; }
    .d-type-vague                { color: var(--yellow); border-color: var(--yellow); }
    .d-type-missing_prerequisite { color: var(--blue); border-color: var(--blue); }
    .d-gap-desc { font-size: 12px; font-weight: 700; color: var(--subtext); line-height: 1.6; }

    .d-session { border: 2px solid var(--border); border-radius: 14px; overflow: hidden; }
    .d-session-head {
      width: 100%; display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: none; border: none;
      font-family: inherit; font-size: 13px; font-weight: 800; color: var(--text);
      cursor: pointer; text-align: left;
    }
    .d-session-head:hover { background: var(--bg); }
    .d-session-meta { flex: 1; color: var(--subtext); font-size: 11px; font-weight: 700; }
    .d-session-body { display: none; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 2px solid var(--border); }
    .d-session.open .d-session-body { display: flex; }

    .d-msg { display: flex; max-width: 88%; }
    .d-msg.feyn { align-self: flex-start; }
    .d-msg.user { align-self: flex-end; }
    .d-msg .d-bubble {
      padding: 8px 12px; font-size: 12px; font-weight: 700; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; border-radius: 12px;
    }
    .d-msg.feyn .d-bubble { background: var(--bg); border: 2px solid var(--border); color: var(--text); }
    .d-msg.user .d-bubble { background: var(--green); color: white; }

    .d-empty { font-size: 12px; font-weight: 700; color: var(--subtext); }

    .temp-pass {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 28px;
      font-weight: 800;
      color: var(--green);
      text-align: center;
      letter-spacing: 3px;
    }

    .modal-close {
      padding: 12px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--green-dark);
      transition: all 0.1s;
    }

    .modal-close:hover { filter: brightness(1.08); }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .summary { grid-template-columns: 1fr; }
      .header  { height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
      .header-divider { display: none; }
      .header-user { display: none; }
      .header-title { flex-basis: auto; }
      .container { padding: 16px; }
      th, td { padding: 10px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">🎓 Feyn</div>
    <div class="header-divider"></div>
    <div class="header-title">📊 講師ダッシュボード</div>
    <div class="header-right">
      <span class="header-user" id="headerUser"></span>
      <button class="btn" id="themeToggle">🌙 ダークモード</button>
      <a href="/" class="btn">← アプリへ戻る</a>
      <button class="btn btn-danger" id="logoutBtn">🚪 ログアウト</button>
    </div>
  </header>

  <div class="container">

    <!-- サマリーカード -->
    <div class="summary" id="summary">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- API使用量 -->
    <div class="section-header">
      <div class="section-title">🔋 今日のGemini使用量</div>
    </div>
    <div class="table-wrap" id="usageWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- 生徒テーブル -->
    <div class="section-header">
      <div class="section-title">生徒一覧</div>
      <div class="student-count" id="studentCount">—</div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="loading">読み込み中...</div>
    </div>

  </div>

  <script>
    // ===== テーマ切り替え =====
    const themeToggle = document.getElementById('themeToggle');

    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeToggle.textContent = isDark ? '☀️ ライトモード' : '🌙 ダークモード';
    }
    updateThemeLabel();

    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('feynTheme', next);
      updateThemeLabel();
    });

    const SUBJECTS = ['物理', '数学', '英語', '化学', '生物', '国語', '歴史'];
    const SUBJECT_EMOJIS = { '物理':'⚡', '数学':'📐', '英語':'🌍', '化学':'⚗️', '生物':'🌿', '国語':'📖', '歴史':'🏛️' };

    let allStudents = [];
    let sortKey     = 'total';
    let sortDir     = 'desc';

    function formatDate(str) {
      if (!str) return '—';
      return str.slice(0, 10);
    }

    function countBadgeClass(cnt) {
      if (cnt >= 5) return 'lv3';
      if (cnt >= 2) return 'lv2';
      if (cnt >= 1) return 'lv1';
      return '';
    }

    function renderSummary(summary) {
      document.getElementById('summary').innerHTML = `
        <div class="summary-card">
          <div class="summary-label">👥 登録生徒数</div>
          <div class="summary-value green">${summary.total_students}</div>
          <div class="summary-sub">人</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">🏆 総クリア数</div>
          <div class="summary-value blue">${summary.total_clears}</div>
          <div class="summary-sub">回</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">📚 最多クリア科目</div>
          <div class="summary-value yellow">${summary.total_clears > 0 ? SUBJECT_EMOJIS[summary.top_subject] : '—'}</div>
          <div class="summary-sub">${summary.total_clears > 0 ? summary.top_subject : 'まだデータなし'}</div>
        </div>
      `;
    }

    function sortStudents(students) {
      return [...students].sort((a, b) => {
        let va, vb;
        if (sortKey === 'total') {
          va = a.total; vb = b.total;
        } else if (sortKey === 'name') {
          va = a.name; vb = b.name;
        } else if (sortKey === 'last_active') {
          va = a.last_active || ''; vb = b.last_active || '';
        } else if (SUBJECTS.includes(sortKey)) {
          va = a.subjects[sortKey] || 0; vb = b.subjects[sortKey] || 0;
        } else {
          va = a.created_at; vb = b.created_at;
        }
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function renderTable(students) {
      document.getElementById('studentCount').textContent = `${students.length}人`;

      if (students.length === 0) {
        document.getElementById('tableWrap').innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji">🎓</div>
            <div class="empty-title">まだ生徒が登録されていません</div>
            <div class="empty-desc">生徒がアカウントを作ると、ここに表示されます</div>
          </div>
        `;
        return;
      }

      const sorted = sortStudents(students);

      function thClass(key) {
        if (sortKey !== key) return 'sortable';
        return `sortable sort-${sortDir}`;
      }

      const headerCells = SUBJECTS.map(s =>
        `<th class="${thClass(s)}" data-key="${s}">${SUBJECT_EMOJIS[s]} ${s}</th>`
      ).join('');

      const rows = sorted.map(s => {
        const subjectCells = SUBJECTS.map(subj => {
          const cnt = s.subjects[subj] || 0;
          const cls = countBadgeClass(cnt);
          return `<td><span class="count-badge ${cls}">${cnt > 0 ? cnt + '回' : '—'}</span></td>`;
        }).join('');

        return `
          <tr>
            <td>
              <div class="td-name">
                <div class="td-name-main">${escHtml(s.name)}</div>
                <div class="td-name-email">${escHtml(s.email)}</div>
              </div>
            </td>
            ${subjectCells}
            <td><span class="count-badge ${s.total > 0 ? 'total' : ''}">${s.total > 0 ? s.total + '回' : '0'}</span></td>
            <td class="td-date">${s.last_active ? '🟢 ' + formatDate(s.last_active) : '未学習'}</td>
            <td class="td-date">${formatDate(s.created_at)}</td>
            <td style="white-space:nowrap;">
              <button class="detail-btn" data-id="${s.id}" style="margin-right:4px;">👀 詳細</button><button class="reset-pass-btn" data-id="${s.id}" data-name="${escHtml(s.name)}">🔑 リセット</button>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('tableWrap').innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="${thClass('name')}" data-key="name">生徒名</th>
              ${headerCells}
              <th class="${thClass('total')}" data-key="total">合計</th>
              <th class="${thClass('last_active')}" data-key="last_active">最終学習</th>
              <th class="${thClass('created_at')}" data-key="created_at">登録日</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll('.reset-pass-btn').forEach(btn => {
        btn.addEventListener('click', () => showResetModal(btn.dataset.id, btn.dataset.name));
      });

      document.querySelectorAll('.detail-btn').forEach(btn => {
        btn.addEventListener('click', () => showStudentModal(btn.dataset.id));
      });

      document.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.dataset.key;
          if (sortKey === key) {
            sortDir = sortDir === 'desc' ? 'asc' : 'desc';
          } else {
            sortKey = key;
            sortDir = 'desc';
          }
          renderTable(allStudents);
        });
      });
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ===== API使用量 =====
    async function loadUsage() {
      const wrap = document.getElementById('usageWrap');
      try {
        const res = await fetch('/api/dashboard/usage');
        const data = await res.json();
        if (!res.ok) { wrap.innerHTML = `<div class="loading">${escHtml(data.error || '読み込みに失敗しました')}</div>`; return; }

        if (data.total_calls === 0) {
          wrap.innerHTML = `<div class="loading">今日はまだ呼び出しがありません</div>`;
          return;
        }

        const rows = data.models_order
          .filter(m => data.by_model[m])
          .map(m => {
            const s = data.by_model[m];
            const failCell = s.fail > 0
              ? `<span class="count-badge" style="background:#FFF0F0;color:#FF4B4B;border-color:#FFB3B3;">${s.fail}</span>`
              : '—';
            return `<tr><td>${escHtml(m)}</td><td><span class="count-badge total">${s.success}</span></td><td>${failCell}</td></tr>`;
          }).join('');

        wrap.innerHTML = `
          <table>
            <thead><tr><th>モデル</th><th>成功</th><th>失敗（枠切れ・過負荷など）</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (e) {
        wrap.innerHTML = `<div class="loading">読み込みに失敗しました</div>`;
      }
    }

    async function init() {
      try {
        const meRes = await fetch('/api/me');
        if (!meRes.ok) { window.location.href = '/login'; return; }
        const me = await meRes.json();
        document.getElementById('headerUser').textContent = me.name;

        const res = await fetch('/api/dashboard');
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (res.status === 403) { window.location.href = '/'; return; }

        const data = await res.json();
        allStudents = data.students;
        renderSummary(data.summary);
        renderTable(allStudents);
        loadUsage();
      } catch (e) {
        document.getElementById('tableWrap').innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji">⚠️</div>
            <div class="empty-title">読み込みに失敗しました</div>
            <div class="empty-desc">ページを再読み込みしてください</div>
          </div>
        `;
      }
    }

    // ===== 生徒詳細モーダル（苦手・理解度・会話ログ） =====
    async function showStudentModal(studentId) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal detail-modal"><div class="loading">読み込み中...</div></div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      let d;
      try {
        const res = await fetch(`/api/dashboard/student/${studentId}`);
        d = await res.json();
        if (!res.ok) throw new Error(d.error);
      } catch (e) {
        overlay.querySelector('.detail-modal').innerHTML = `<div class="modal-desc">読み込みに失敗しました</div>`;
        return;
      }

      const scoreColor = v => v >= 70 ? 'var(--green)' : (v >= 40 ? 'var(--yellow)' : '#FF4B4B');

      const progressHtml = d.progress.length === 0
        ? `<div class="d-empty">まだ分析データがありません</div>`
        : d.progress.map(p => `
            <div class="d-progress-row">
              <span class="d-progress-name">${SUBJECT_EMOJIS[p.subject] || '📚'} ${escHtml(p.topic)} <small>（${p.sessions_count}回）</small></span>
              <div class="d-progress-track"><div class="d-progress-fill" style="width:${p.understanding}%;background:${scoreColor(p.understanding)}"></div></div>
              <span class="d-progress-score">${p.understanding}</span>
            </div>
          `).join('');

      const gapHtml = g => `
        <div class="d-gap ${g.status === 'resolved' ? 'resolved' : ''}">
          <div class="d-gap-top">
            <span class="d-gap-topic">${SUBJECT_EMOJIS[g.subject] || '📚'} ${escHtml(g.topic)}</span>
            ${g.status === 'resolved'
              ? '<span class="d-gap-type" style="color:var(--green);border-color:var(--green);">✅ 解決済み</span>'
              : `<span class="d-gap-type d-type-${escHtml(g.gap_type)}">${escHtml(d.labels[g.gap_type] || g.gap_type)}</span>`}
          </div>
          <div class="d-gap-desc">${escHtml(g.description)}</div>
        </div>
      `;
      const openGaps     = d.gaps.filter(g => g.status !== 'resolved');
      const resolvedGaps = d.gaps.filter(g => g.status === 'resolved');
      const gapsHtml = d.gaps.length === 0
        ? `<div class="d-empty">記録された苦手はまだありません</div>`
        : openGaps.map(gapHtml).join('') + resolvedGaps.map(gapHtml).join('');

      const sessionsHtml = d.sessions.length === 0
        ? `<div class="d-empty">まだ会話がありません</div>`
        : d.sessions.map(s => `
            <div class="d-session">
              <button class="d-session-head">
                <span>${SUBJECT_EMOJIS[s.subject] || '📚'} ${escHtml(s.subject)}</span>
                <span class="d-session-meta">${escHtml(s.date)} ・ ${escHtml(s.difficulty)} ・ 💬 ${s.messages.length}</span>
                <span>▶</span>
              </button>
              <div class="d-session-body">
                ${s.messages.map(m => `
                  <div class="d-msg ${m.role === 'user' ? 'user' : 'feyn'}"><div class="d-bubble">${escHtml(m.message)}</div></div>
                `).join('')}
              </div>
            </div>
          `).join('');

      overlay.querySelector('.detail-modal').innerHTML = `
        <div class="modal-title">👤 ${escHtml(d.student.name)}</div>
        <div class="modal-desc">${escHtml(d.student.email)}</div>
        <div class="detail-section-title">📊 テーマ別の理解度</div>
        ${progressHtml}
        <div class="detail-section-title">📝 知識のギャップ（未解決 ${openGaps.length}件 / 解決済み ${resolvedGaps.length}件）</div>
        ${gapsHtml}
        <div class="detail-section-title">💬 会話ログ</div>
        ${sessionsHtml}
        <button class="modal-close" id="detailClose">閉じる</button>
      `;

      overlay.querySelectorAll('.d-session-head').forEach(btn => {
        btn.addEventListener('click', () => btn.parentElement.classList.toggle('open'));
      });
      document.getElementById('detailClose').addEventListener('click', () => overlay.remove());
    }

    function showResetModal(studentId, studentName) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-title">🔑 パスワードリセット</div>
          <div class="modal-desc" id="modalDesc">${escHtml(studentName)} さんのパスワードをリセットしますか？</div>
          <div style="display:flex;gap:8px;">
            <button class="modal-close" style="background:#AFAFAF;box-shadow:0 4px 0 #888;" id="modalCancel">キャンセル</button>
            <button class="modal-close" id="modalConfirm">リセットする</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('modalCancel').addEventListener('click', () => overlay.remove());

      document.getElementById('modalConfirm').addEventListener('click', async () => {
        document.getElementById('modalConfirm').disabled = true;
        document.getElementById('modalConfirm').textContent = '処理中...';

        const res  = await fetch('/api/dashboard/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student_id: parseInt(studentId) }),
        });
        const data = await res.json();

        if (!res.ok) {
          document.getElementById('modalDesc').textContent = data.error || 'エラーが発生しました';
          document.getElementById('modalConfirm').style.display = 'none';
          return;
        }

        overlay.querySelector('.modal').innerHTML = `
          <div class="modal-title">✅ リセット完了</div>
          <div class="modal-desc">${escHtml(studentName)} さんの仮パスワードです。本人に伝えてください。</div>
          <div class="temp-pass">${data.temp_password}</div>
          <div class="modal-desc" style="font-size:12px;">次回ログイン後にパスワードを変更するよう伝えてください</div>
          <button class="modal-close" id="modalDone">閉じる</button>
        `;
        document.getElementById('modalDone').addEventListener('click', () => overlay.remove());
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    init();
  </script>
</body>
</html>
