<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feyn - 講師ダッシュボード</title>
  <script>
    // ちらつき防止のため、描画前に保存済みテーマを適用する
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('feynTheme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <link rel="stylesheet" href="/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--paper-2);
      color: var(--ink);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ===== ヘッダー ===== */
    .header {
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 2px;
    }

    .header-divider {
      width: 2px;
      height: 24px;
      background: var(--rule);
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      flex: 1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-user {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--r-md);
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-soft);
      font-size: 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { border-color: var(--ink); color: var(--ink); }
    .btn-danger:hover { border-color: var(--red); color: var(--red); background: var(--paper-2); }

    /* ===== コンテンツ ===== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== サマリーカード ===== */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .summary-card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
    }

    .summary-value.green  { color: var(--ink); }
    .summary-value.blue   { color: var(--ink); }
    .summary-value.yellow { color: var(--meter); }

    .summary-sub {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    /* ===== テーブルセクション ===== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .student-count {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
      background: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: var(--r-pill);
      padding: 4px 12px;
    }

    .table-wrap {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      overflow: hidden;
      overflow-x: auto;   /* スマホでは表を横スクロールできるようにする */
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--paper-2);
      border-bottom: 1px solid var(--rule);
    }

    th {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      text-align: center;
      white-space: nowrap;
    }

    th:first-child { text-align: left; }

    tbody tr {
      border-bottom: 2px solid var(--paper-2);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--paper-2); }

    td {
      padding: 16px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: var(--ink);
    }

    td:first-child { text-align: left; }

    .td-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .td-name-main {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .td-name-email {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .count-badge {
      display: inline-block;
      min-width: 32px;
      padding: 4px 8px;
      border-radius: var(--r-pill);
      font-size: 14px;
      font-weight: 800;
      background: var(--paper-2);
      color: var(--ink-soft);
      border: 1px solid var(--rule);
    }

    .count-badge.lv1 { background: color-mix(in srgb, var(--brand) 14%, var(--paper)); color: var(--ink); border-color: transparent; }
    .count-badge.lv2 { background: color-mix(in srgb, var(--brand) 32%, var(--paper)); color: var(--ink); border-color: transparent; }
    .count-badge.lv3 { background: var(--brand); color: var(--on-brand); border-color: transparent; }

    .count-badge.total {
      background: var(--red); color: var(--on-red);
      color: white;
      border-color: var(--red-dark);
      box-shadow: var(--shadow-press);
    }

    .plan-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .plan-tag.free { background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--rule); }
    .plan-tag.active { background: var(--hint-bg); color: var(--ink); }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover { color: var(--ink); }
    th.sort-asc::after  { content: ' ▲'; color: var(--ink); }
    th.sort-desc::after { content: ' ▼'; color: var(--ink); }

    .td-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    /* ===== 空状態 ===== */
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-emoji { font-size: 48px; }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .empty-desc {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    /* ===== ローディング ===== */
    .loading {
      padding: 64px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    /* ===== リセットボタン ===== */
    .reset-pass-btn {
      padding: 5px 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .reset-pass-btn:hover { border-color: var(--red); color: var(--red); background: var(--paper-2); }

    .detail-btn {
      padding: 5px 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .detail-btn:hover { border-color: var(--ink); color: var(--ink); }

    .assign-btn {
      padding: 5px 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .assign-btn:hover { border-color: var(--ink); color: var(--ink); }
    .csv-btn { text-decoration: none; display: inline-block; }

    .modal select {
      width: 100%; padding: 10px 12px;
      border-radius: var(--r-md); border: 1px solid var(--rule);
      background: var(--paper-2); color: var(--ink);
      font-size: 14px; font-family: inherit; font-weight: 700;
      outline: none;
    }
    .modal label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }


    .submission-list { display: flex; flex-direction: column; gap: 8px; padding: 14px; }
    .submission-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-md);
      font-size: 14px; font-weight: 700;
    }
    .submission-row .submission-info { flex: 1; }
    .submission-row .submission-time { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: var(--scrim);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }

    .modal {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      padding: 32px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-lift);
    }

    .modal-title { font-size: 18px; font-weight: 800; color: var(--ink); }
    .modal-desc  { font-size: 14px; font-weight: 700; color: var(--ink-soft); line-height: 1.6; }

    .temp-pass {
      background: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: var(--r-md);
      padding: 16px;
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      letter-spacing: 3px;
    }

    .modal-close {
      padding: 12px;
      background: var(--red); color: var(--on-red);
      color: white;
      border: none;
      border-radius: var(--r-md);
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-press);
      transition: all 0.1s;
    }

    .modal-close:hover { filter: brightness(1.08); }

    /* ===== 利用状況（直近30日） ===== */
    .metrics-box {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .metric { border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .metric-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.1; }
    .metric-sub { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
    .metrics-subtitle { font-size: 14px; font-weight: 800; color: var(--ink); }
    .metrics-note { font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.6; }
    .dropout-row { display: grid; grid-template-columns: 120px 1fr 48px; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink); }
    .dropout-bar { height: 12px; border-radius: var(--r-pill); background: var(--rule); overflow: hidden; }
    .dropout-fill { height: 100%; border-radius: var(--r-pill); background: var(--meter); }
    .dropout-count { text-align: right; color: var(--ink-soft); }
    .stumble-row { display: grid; grid-template-columns: minmax(0, 1.4fr) 2fr 110px; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
    .stumble-topic { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stumble-topic small { color: var(--ink-soft); font-weight: 700; }
    .stumble-fill { height: 100%; border-radius: var(--r-pill); }
    .stumble-count { text-align: right; color: var(--ink-soft); font-size: 12px; }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .summary { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .dropout-row { grid-template-columns: 96px 1fr 40px; }
      .stumble-row { grid-template-columns: 1fr 90px; }
      .stumble-row .dropout-bar { grid-column: 1 / -1; grid-row: 2; }
      .header  { height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
      .header-divider { display: none; }
      .header-user { display: none; }
      .header-title { flex-basis: auto; }
      .container { padding: 16px; }
      th, td { padding: 10px 8px; font-size: 12px; }
    }
    .modal-cancel { background: var(--paper) !important; color: var(--ink) !important; border: 1px solid var(--rule) !important; box-shadow: none !important; }
    .header-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
    .logo-mark { width: 28px; height: 28px; border-radius: var(--r-md); background: var(--brand); display: grid; place-items: center; }
    .logo-mark svg { width: 18px; height: 18px; }
    .logo-text { font-size: 18px; font-weight: 900; }
    /* スマホ: ヘッダーを折り返して、名前が縦1文字ずつにならないように */
    @media (max-width: 600px) {
      .header { height: auto; min-height: 56px; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
      .header-divider, .logo-text, .header-user { display: none; }
      .header-title, .header-titles { flex: 1; min-width: 0; }
      .header-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
      .header-right { width: 100%; display: flex; gap: 4px; }
      .header-right .btn { flex: 1; min-height: 40px; padding: 4px 8px; white-space: nowrap; font-size: 14px; }
      /* 生徒一覧の上のボタンの列（CSV・課題を出す）は折り返す（画面の横にはみ出さないように） */
      .section-header { flex-wrap: wrap; gap: 8px; }
      .section-header > div { flex-wrap: wrap; }
    }
    /* ===== 見ている範囲（先生: 自分の塾・学校／運営: 組織の切り替え） ===== */
    .scope-bar {
      display: flex; flex-direction: column; gap: 8px;
      padding: 16px 24px;
      background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-sm);
    }
    .scope-bar[hidden] { display: none; }
    .scope-title { font-size: 16px; font-weight: 900; color: var(--ink); }
    .scope-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.7; }
    .scope-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .scope-row label { font-size: 14px; font-weight: 700; color: var(--ink); }
    .scope-row select, .scope-row input {
      min-height: 44px; min-width: 0; max-width: 100%; padding: 8px 12px;
      border: 1px solid var(--rule); border-radius: var(--r-sm);
      background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px;
    }
    .scope-row input { flex: 1 1 200px; letter-spacing: 0.05em; }
    .scope-row select:focus, .scope-row input:focus { outline: none; border-color: var(--ink); }
    .scope-btn {
      min-height: 44px; padding: 8px 16px;
      border: 1px solid var(--rule); border-radius: var(--r-md);
      background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .scope-btn:hover { background: var(--paper-2); }
    .scope-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .scope-error { font-size: 14px; font-weight: 700; color: var(--red); }
    .scope-error:empty { display: none; }
    .td-school { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }

    /* ===== 運営アカウントの閲覧の記録 ===== */
    .access-log { display: flex; flex-direction: column; }
    .access-row {
      display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 4px 16px;
      padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.6;
    }
    .access-row:last-child { border-bottom: none; }
    .access-time { color: var(--ink-soft); white-space: nowrap; }
    .access-main { min-width: 0; overflow-wrap: anywhere; }
    .access-sub { font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
    .access-more { padding: 12px 16px; }
    @media (max-width: 600px) {
      .scope-bar { padding: 16px; }
      .access-row { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a class="header-logo" href="/" aria-label="Feyn アプリへ"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5L12 14z" fill="#FFFFFF"/><path d="M6.5 11.6V16c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.4L12 14z" fill="#FFFFFF"/></svg></span><span class="logo-text">Feyn</span></a>
    <div class="header-divider"></div>
    <div class="header-title">講師ダッシュボード</div>
    <div class="header-right">
      <span class="header-user" id="headerUser"></span>
      <button class="btn" id="themeToggle">ダークモード</button>
      <a href="/" class="btn">← アプリへ戻る</a>
      <button class="btn btn-danger" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <div class="container">

    <!-- 見ている範囲。先生: 自分の塾・学校（入っていなければ先生コードの入力）／運営: 組織の切り替え -->
    <section class="scope-bar" id="scopeBar" hidden aria-live="polite"></section>

    <!-- サマリーカード -->
    <div class="summary" id="summary">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- 利用状況（会話の開始・完了・離脱・有料化） -->
    <div class="section-header">
      <div class="section-title">利用状況（直近30日）</div>
    </div>
    <div class="metrics-box" id="metricsWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- つまずきマップ -->
    <div class="section-header">
      <div class="section-title">つまずきマップ（苦手ノートに残っている生徒の割合）</div>
    </div>
    <div class="metrics-box" id="stumbleWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- API使用量 -->
    <div class="section-header">
      <div class="section-title">今日のGemini使用量</div>
    </div>
    <div class="table-wrap" id="usageWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- 課題の提出状況 -->
    <div class="section-header">
      <div class="section-title">最近提出された課題</div>
    </div>
    <div class="table-wrap" id="submissionsWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- 生徒テーブル -->
    <div class="section-header">
      <div class="section-title">生徒一覧</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a class="assign-btn csv-btn" id="csvLink" href="/api/dashboard/students.csv" download title="生徒ごとの進捗・クリア数（会話の中身は含みません）">CSVで書き出す</a>
        <button class="assign-btn" id="bulkAssignBtn" disabled>選択した生徒に課題を出す（<span id="bulkAssignCount">0</span>人）</button>
        <div class="student-count" id="studentCount">—</div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- 運営アカウントだけ: だれが・いつ・どの生徒の・何を見たか -->
    <div id="accessLogSection" hidden>
      <div class="section-header">
        <div class="section-title">運営アカウントの閲覧の記録</div>
      </div>
      <div class="table-wrap" id="accessLogWrap">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

  </div>

  <script>
    // ===== テーマ切り替え =====
    const themeToggle = document.getElementById('themeToggle');

    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeToggle.textContent = isDark ? 'ライトモード' : 'ダークモード';
    }
    updateThemeLabel();

    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('feynTheme', next);
      updateThemeLabel();
    });

    const SUBJECTS = ['物理', '数学', '英語', '化学', '生物', '国語', '歴史'];
    const SUBJECT_EMOJIS = { '物理':'', '数学':'', '英語':'', '化学':'', '生物':'', '国語':'', '歴史':'' };

    // アプリ側（script.js）の単元選択と同じ内容。課題アサインの単元プルダウンに使う
    const UNIT_CURRICULUM = {
      '物理': {
        '力学':   ['運動の法則', 'エネルギーと運動量', '円運動・万有引力', '単振動'],
        '熱力学': ['熱と温度', '気体の性質', '熱力学の法則'],
        '波動':   ['波の性質', '音', '光'],
        '電磁気': ['電気', '磁気', '電磁誘導', '交流'],
        '原子':   ['電子と光', '原子と原子核'],
      },
      '数学': {
        '数学I':   ['数と式', '集合と命題', '二次関数', '図形と計量', 'データの分析'],
        '数学II':  ['いろいろな式', '図形と方程式', '指数関数・対数関数', '三角関数', '微分・積分の考え方'],
        '数学III': ['極限', '微分法', '積分法'],
        '数学A':   ['図形の性質', '場合の数と確率', '数学と人間の活動'],
        '数学B':   ['数列', '統計的な推測'],
        '数学C':   ['ベクトル', '平面上の曲線と複素数平面'],
      },
      '英語': {
        '文法':     ['時制', '仮定法', '関係詞', '比較', '不定詞・動名詞・分詞', '受動態', '話法'],
        '構文・語法': ['倒置・強調・省略', '前置詞・句動詞', '接続詞'],
      },
      '化学': {
        '理論化学': ['物質の構成', '化学結合', '物質量と化学反応式', '酸と塩基', '酸化還元', '化学反応と熱', '電池・電気分解', '反応速度・化学平衡'],
        '無機化学': ['非金属元素', '金属元素とイオン'],
        '有機化学': ['炭化水素', 'アルコール・カルボニル化合物', '芳香族化合物', '高分子化合物'],
      },
      '生物': {
        '細胞と分子':   ['細胞の構造', '代謝', '遺伝情報の発現'],
        '生殖と発生':   ['生殖', '発生のしくみ'],
        '生物の体内環境': ['恒常性', '免疫'],
        '生態と進化':   ['生態系', '進化と系統'],
      },
      '国語': {
        '現代文': ['評論の読解', '小説の読解', '随筆の読解'],
        '古文':   ['古文文法', '古文単語・古典常識'],
        '漢文':   ['句法', '漢詩'],
      },
      '歴史': {
        '日本史': ['原始・古代', '中世', '近世', '近代', '現代'],
        '世界史': ['古代文明', '中世', '近世', '近代', '現代'],
      },
    };

    let allStudents = [];
    // viewer: { kind: 'teacher' | 'operator', school, in_default, can_write }（/api/dashboard が返す）
    let viewer = { kind: 'teacher', school: null, in_default: false, can_write: true };
    let scopeSchool = '';   // 運営アカウントが絞り込んでいる組織のID（'' は全組織）

    function scopeParam(joiner) {
      return viewer.kind === 'operator' && scopeSchool ? `${joiner}school=${encodeURIComponent(scopeSchool)}` : '';
    }
    let sortKey     = 'total';
    let sortDir     = 'desc';
    const selectedStudentIds = new Set(); // 課題一括アサイン用の選択状態（文字列のstudent_idを保持）

    function formatDate(str) {
      if (!str) return '—';
      return str.slice(0, 10);
    }

    function formatDateTime(str) {
      if (!str) return '—';
      return str.replace('T', ' ').slice(0, 16);
    }

    function renderSubmissions(list) {
      const wrap = document.getElementById('submissionsWrap');
      if (!list || list.length === 0) {
        wrap.innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji"></div>
            <div class="empty-title">まだ提出された課題はありません</div>
            <div class="empty-desc">生徒が課題を終えると、ここに表示されます</div>
          </div>
        `;
        return;
      }
      wrap.innerHTML = `
        <div class="submission-list">
          ${list.map(sub => `
            <div class="submission-row">
              <span class="submission-info">
                ${SUBJECT_EMOJIS[sub.subject] || ''} <strong>${escHtml(sub.student_name)}</strong>さんが
                「${escHtml(sub.subject)}${sub.unit ? '・' + escHtml(sub.unit) : ''}」の課題を提出しました
              </span>
              <span class="submission-time">${formatDateTime(sub.completed_at)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function countBadgeClass(cnt) {
      if (cnt >= 5) return 'lv3';
      if (cnt >= 2) return 'lv2';
      if (cnt >= 1) return 'lv1';
      return '';
    }

    function renderSummary(summary) {
      document.getElementById('summary').innerHTML = `
        <div class="summary-card">
          <div class="summary-label">登録生徒数</div>
          <div class="summary-value green">${summary.total_students}</div>
          <div class="summary-sub">人</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">総クリア数</div>
          <div class="summary-value blue">${summary.total_clears}</div>
          <div class="summary-sub">回</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">最多クリア科目</div>
          <div class="summary-value yellow">${summary.total_clears > 0 ? SUBJECT_EMOJIS[summary.top_subject] : '—'}</div>
          <div class="summary-sub">${summary.total_clears > 0 ? summary.top_subject : 'まだデータなし'}</div>
        </div>
      `;
    }

    function sortStudents(students) {
      return [...students].sort((a, b) => {
        let va, vb;
        if (sortKey === 'total') {
          va = a.total; vb = b.total;
        } else if (sortKey === 'name') {
          va = a.name; vb = b.name;
        } else if (sortKey === 'last_active') {
          va = a.last_active || ''; vb = b.last_active || '';
        } else if (sortKey === 'last_login') {
          va = a.last_login || ''; vb = b.last_login || '';
        } else if (sortKey === 'subscription_status') {
          va = a.subscription_status === 'active' ? 1 : 0;
          vb = b.subscription_status === 'active' ? 1 : 0;
        } else if (SUBJECTS.includes(sortKey)) {
          va = a.subjects[sortKey] || 0; vb = b.subjects[sortKey] || 0;
        } else {
          va = a.created_at; vb = b.created_at;
        }
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function renderTable(students) {
      document.getElementById('studentCount').textContent = `${students.length}人`;

      if (students.length === 0) {
        const emptyTitle = viewer.in_default ? 'まだ塾・学校に入っていません' : 'まだ生徒が登録されていません';
        const emptyDesc = viewer.in_default
          ? '上の欄に先生コードを入れると、その塾・学校の生徒が表示されます'
          : '生徒が参加コードを入れて登録すると、ここに表示されます';
        document.getElementById('tableWrap').innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji"></div>
            <div class="empty-title">${emptyTitle}</div>
            <div class="empty-desc">${emptyDesc}</div>
          </div>
        `;
        return;
      }

      const sorted = sortStudents(students);

      function thClass(key) {
        if (sortKey !== key) return 'sortable';
        return `sortable sort-${sortDir}`;
      }

      const headerCells = SUBJECTS.map(s =>
        `<th class="${thClass(s)}" data-key="${s}">${SUBJECT_EMOJIS[s]} ${s}</th>`
      ).join('');

      const rows = sorted.map(s => {
        const subjectCells = SUBJECTS.map(subj => {
          const cnt = s.subjects[subj] || 0;
          const cls = countBadgeClass(cnt);
          return `<td><span class="count-badge ${cls}">${cnt > 0 ? cnt + '回' : '—'}</span></td>`;
        }).join('');

        const writeCell = viewer.can_write
          ? `<td><input type="checkbox" class="student-select" data-id="${s.id}" data-name="${escHtml(s.name)}" aria-label="${escHtml(s.name)}さんを選ぶ" ${selectedStudentIds.has(String(s.id)) ? 'checked' : ''}></td>`
          : '';
        const schoolCell = viewer.kind === 'operator' ? `<td class="td-school">${escHtml(s.school_name || '')}</td>` : '';
        const actions = viewer.can_write
          ? `<button class="detail-btn" data-id="${s.id}" style="margin-right:4px;">詳細</button><button class="assign-btn" data-id="${s.id}" data-name="${escHtml(s.name)}" style="margin-right:4px;">課題</button><button class="reset-pass-btn" data-id="${s.id}" data-name="${escHtml(s.name)}">リセット</button>`
          : `<button class="detail-btn" data-id="${s.id}">詳細</button>`;
        return `
          <tr>
            ${writeCell}
            <td>
              <a class="td-name" href="/dashboard/student/${s.id}" style="text-decoration:none;color:inherit;">
                <div class="td-name-main">${escHtml(s.name)}</div>
                <div class="td-name-email">${escHtml(s.email)}</div>
              </a>
            </td>
            ${schoolCell}
            <td>${s.subscription_status === 'active' ? '<span class="plan-tag active">有料</span>' : '<span class="plan-tag free">無料</span>'}</td>
            ${subjectCells}
            <td><span class="count-badge ${s.total > 0 ? 'total' : ''}">${s.total > 0 ? s.total + '回' : '0'}</span></td>
            <td class="td-date">${s.last_active ? '' + formatDate(s.last_active) : '未学習'}</td>
            <td class="td-date">${formatDateTime(s.last_login)}</td>
            <td class="td-date">${formatDate(s.created_at)}</td>
            <td style="white-space:nowrap;">${actions}</td>
          </tr>
        `;
      }).join('');

      const allChecked = sorted.length > 0 && sorted.every(s => selectedStudentIds.has(String(s.id)));

      document.getElementById('tableWrap').innerHTML = `
        <table>
          <thead>
            <tr>
              ${viewer.can_write ? `<th><input type="checkbox" id="selectAllStudents" aria-label="全員を選ぶ" ${allChecked ? 'checked' : ''}></th>` : ''}
              <th class="${thClass('name')}" data-key="name">生徒名</th>
              ${viewer.kind === 'operator' ? '<th>塾・学校</th>' : ''}
              <th class="${thClass('subscription_status')}" data-key="subscription_status">プラン</th>
              ${headerCells}
              <th class="${thClass('total')}" data-key="total">合計</th>
              <th class="${thClass('last_active')}" data-key="last_active">最終学習</th>
              <th class="${thClass('last_login')}" data-key="last_login">最終ログイン</th>
              <th class="${thClass('created_at')}" data-key="created_at">登録日</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll('.reset-pass-btn').forEach(btn => {
        btn.addEventListener('click', () => showResetModal(btn.dataset.id, btn.dataset.name));
      });

      document.querySelectorAll('.detail-btn').forEach(btn => {
        btn.addEventListener('click', () => { window.location.href = `/dashboard/student/${btn.dataset.id}`; });
      });

      document.querySelectorAll('.assign-btn[data-id]').forEach(btn => {
        btn.addEventListener('click', () => showAssignModal([{ id: btn.dataset.id, name: btn.dataset.name }]));
      });

      document.querySelectorAll('.student-select').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) selectedStudentIds.add(cb.dataset.id);
          else selectedStudentIds.delete(cb.dataset.id);
          updateBulkAssignButton();
        });
      });

      const selectAll = document.getElementById('selectAllStudents');
      if (selectAll) selectAll.addEventListener('change', (e) => {
        sorted.forEach(s => {
          if (e.target.checked) selectedStudentIds.add(String(s.id));
          else selectedStudentIds.delete(String(s.id));
        });
        renderTable(allStudents);
      });

      document.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.dataset.key;
          if (sortKey === key) {
            sortDir = sortDir === 'desc' ? 'asc' : 'desc';
          } else {
            sortKey = key;
            sortDir = 'desc';
          }
          renderTable(allStudents);
        });
      });

      updateBulkAssignButton();
    }

    function updateBulkAssignButton() {
      const btn = document.getElementById('bulkAssignBtn');
      document.getElementById('bulkAssignCount').textContent = selectedStudentIds.size;
      btn.disabled = selectedStudentIds.size === 0;
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ===== 利用状況（直近30日） =====
    const MODE_LABELS = { normal: '通常', review: '復習', assignment: '課題', photo: '写真' };

    function metricTile(label, value, sub) {
      return `
        <div class="metric">
          <div class="metric-label">${label}</div>
          <div class="metric-value">${value}</div>
          ${sub ? `<div class="metric-sub">${sub}</div>` : ''}
        </div>`;
    }

    async function loadMetrics() {
      const wrap = document.getElementById('metricsWrap');
      try {
        const res = await fetch('/api/dashboard/metrics?days=30' + scopeParam('&'));
        const m = await res.json();
        if (!res.ok) { wrap.innerHTML = `<div class="loading">${escHtml(m.error || '読み込みに失敗しました')}</div>`; return; }

        const rate = m.completion_rate === null ? '—' : `${m.completion_rate}%`;
        const avgTurns = m.avg_turns_to_complete === null ? '—' : `${m.avg_turns_to_complete}`;
        const modes = Object.entries(m.started_by_mode || {})
          .map(([k, v]) => `${escHtml(MODE_LABELS[k] || k)} ${Number(v)}`).join('・');

        const d = m.dropout_by_turn;
        const dropoutTotal = d['0'] + d['1'] + d['2'] + d['3+'];
        const rows = [
          ['返信せずに終了', d['0']], ['1往復目で終了', d['1']], ['2往復目で終了', d['2']], ['3往復以上で終了', d['3+']],
        ].map(([label, n]) => {
          const pct = dropoutTotal ? Math.round(n / dropoutTotal * 100) : 0;
          return `
            <div class="dropout-row">
              <span>${label}</span>
              <div class="dropout-bar"><div class="dropout-fill" style="width:${pct}%"></div></div>
              <span class="dropout-count">${Number(n)}</span>
            </div>`;
        }).join('');

        wrap.innerHTML = `
          <div class="metrics-grid">
            ${metricTile('使った生徒', `${Number(m.active_students)}人`, '')}
            ${metricTile('会話の開始', `${Number(m.started)}回`, modes)}
            ${metricTile('完了率', rate, `${Number(m.completed)}回完了・平均${avgTurns}往復`)}
            ${metricTile('ライフ切れ', `${Number(m.life_blocked)}回`, `${Number(m.life_blocked_students)}人`)}
            ${metricTile('新規登録', `${Number(m.signups)}人`, '')}
            ${metricTile('有料化', `${Number(m.subscriptions_started)}件`, `解約 ${Number(m.subscriptions_ended)}件`)}
            ${metricTile('いまの有料会員', `${Number(m.plans.active)}人`, `無料 ${Number(m.plans.free)}人`)}
            ${metricTile('進行中', `${Number(m.in_progress)}回`, '始めて1時間以内')}
          </div>
          <div class="metrics-subtitle">途中でやめた会話（${dropoutTotal}回）は何往復目で止まったか</div>
          ${rows}
          <div class="metrics-note">${escHtml(m.since)}以降の集計です。記録しているのは回数・往復数・日時だけで、会話の中身は含みません。</div>
        `;
      } catch (e) {
        wrap.innerHTML = `<div class="loading">読み込みに失敗しました</div>`;
      }
    }

    // ===== つまずきマップ =====
    // 割合が高いほど濃い色にする（多くの生徒がつまずいているテーマが一目で分かるように）
    function stumbleColor(rate) {
      if (rate >= 50) return 'var(--red)';
      if (rate >= 25) return 'var(--meter)';
      return 'var(--ink-soft)';
    }

    async function loadStumbleMap() {
      const wrap = document.getElementById('stumbleWrap');
      try {
        const res = await fetch('/api/dashboard/stumble-map' + scopeParam('?'));
        const data = await res.json();
        if (!res.ok) { wrap.innerHTML = `<div class="loading">${escHtml(data.error || '読み込みに失敗しました')}</div>`; return; }
        if (data.topics.length === 0) {
          wrap.innerHTML = '<div class="loading">苦手ノートに残っているテーマはまだありません</div>';
          return;
        }
        const rows = data.topics.map(t => `
          <div class="stumble-row">
            <span class="stumble-topic" title="${escHtml(t.subject)}：${escHtml(t.topic)}">${SUBJECT_EMOJIS[t.subject] || ''} ${escHtml(t.topic)} <small>${escHtml(t.subject)}</small></span>
            <div class="dropout-bar"><div class="stumble-fill" style="width:${Number(t.rate)}%; background:${stumbleColor(Number(t.rate))}"></div></div>
            <span class="stumble-count">${Number(t.rate)}%（${Number(t.students)}人 / ${Number(data.total_students)}人）</span>
          </div>`).join('');
        const more = data.more > 0 ? `<div class="metrics-note">ほかに ${Number(data.more)} テーマあります（人数の多い順に上位を表示）</div>` : '';
        wrap.innerHTML = rows + more + `
          <div class="metrics-note">苦手ノートに「未解決」で残っている生徒の数です。復習で解決すると数から外れます。テーマ名は会話の分析でAIが付けたものです。</div>`;
      } catch (e) {
        wrap.innerHTML = '<div class="loading">読み込みに失敗しました</div>';
      }
    }

    // ===== API使用量 =====
    async function loadUsage() {
      const wrap = document.getElementById('usageWrap');
      try {
        const res = await fetch('/api/dashboard/usage');
        const data = await res.json();
        if (!res.ok) { wrap.innerHTML = `<div class="loading">${escHtml(data.error || '読み込みに失敗しました')}</div>`; return; }

        if (data.total_calls === 0) {
          wrap.innerHTML = `<div class="loading">今日はまだ呼び出しがありません</div>`;
          return;
        }

        const rows = data.models_order
          .filter(m => data.by_model[m])
          .map(m => {
            const s = data.by_model[m];
            const failCell = s.fail > 0
              ? `<span class="count-badge" style="background:var(--paper-2);color:var(--red);border-color:var(--red);">${s.fail}</span>`
              : '—';
            return `<tr><td>${escHtml(m)}</td><td><span class="count-badge total">${s.success}</span></td><td>${failCell}</td></tr>`;
          }).join('');

        wrap.innerHTML = `
          <table>
            <thead><tr><th>モデル</th><th>成功</th><th>失敗（枠切れ・過負荷など）</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (e) {
        wrap.innerHTML = `<div class="loading">読み込みに失敗しました</div>`;
      }
    }

    async function init() {
      try {
        const meRes = await fetch('/api/me');
        if (!meRes.ok) { window.location.href = '/login'; return; }
        const me = await meRes.json();
        document.getElementById('headerUser').textContent = me.name;
        await loadDashboard();
        loadUsage();
      } catch (e) {
        document.getElementById('tableWrap').innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji"></div>
            <div class="empty-title">読み込みに失敗しました</div>
            <div class="empty-desc">ページを再読み込みしてください</div>
          </div>
        `;
      }
    }


    async function loadDashboard() {
      const res = await fetch('/api/dashboard' + scopeParam('?'));
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (res.status === 403) { window.location.href = '/'; return; }

      const data = await res.json();
      viewer = data.viewer || viewer;
      allStudents = data.students;
      if (!viewer.can_write) selectedStudentIds.clear();
      document.getElementById('bulkAssignBtn').hidden = !viewer.can_write;
      document.getElementById('csvLink').href = '/api/dashboard/students.csv' + scopeParam('?');
      document.querySelector('.header-title').textContent = viewer.kind === 'operator' ? '運営ダッシュボード' : '講師ダッシュボード';
      renderScope(data);
      renderSummary(data.summary);
      renderSubmissions(data.recent_submissions);
      renderTable(allStudents);
      loadMetrics();
      loadStumbleMap();
      if (viewer.kind === 'operator') loadAccessLogs(0);
    }

    // ===== 見ている範囲 =====
    function renderScope(data) {
      const bar = document.getElementById('scopeBar');
      if (viewer.kind === 'operator') {
        const options = [`<option value="">すべての組織（${(data.schools || []).reduce((n, sc) => n + sc.students, 0)}人）</option>`]
          .concat((data.schools || []).map(sc => {
            const label = sc.is_default ? 'どこにも入っていない生徒' : sc.name;
            return `<option value="${sc.id}" ${String(sc.id) === String(scopeSchool) ? 'selected' : ''}>${escHtml(label)}（${Number(sc.students)}人）</option>`;
          })).join('');
        bar.innerHTML = `
          <div class="scope-title">運営アカウントとして表示しています</div>
          <div class="scope-desc">すべての塾・学校の生徒を見られます。生徒の詳細・会話ログ・CSVを開くと「閲覧の記録」に残ります（会話の中身は記録しません）。課題を出す・パスワードを再発行するのは、各塾・学校の先生だけです。</div>
          <div class="scope-row">
            <label for="scopeSelect">表示する組織</label>
            <select id="scopeSelect">${options}</select>
          </div>`;
        bar.hidden = false;
        document.getElementById('scopeSelect').addEventListener('change', (e) => {
          scopeSchool = e.target.value;
          loadDashboard();
        });
        return;
      }
      if (viewer.in_default) {
        bar.innerHTML = `
          <div class="scope-title">塾・学校の先生コードを入れてください</div>
          <div class="scope-desc">まだどの塾・学校にも入っていないため、生徒は表示されません。運営から受け取った先生コードを入れると、その塾・学校の生徒だけが表示されます。</div>
          <form class="scope-row" id="teacherJoinForm">
            <label for="teacherJoinInput">先生コード</label>
            <input id="teacherJoinInput" type="text" placeholder="例: ABCD-EFGH-JKMN" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button class="scope-btn" id="teacherJoinBtn" type="submit">入る</button>
          </form>
          <div class="scope-error" id="teacherJoinError" role="alert"></div>`;
        bar.hidden = false;
        document.getElementById('teacherJoinForm').addEventListener('submit', joinAsTeacher);
        return;
      }
      bar.innerHTML = `<div class="scope-desc"><strong>${escHtml(viewer.school || '')}</strong>の生徒だけが表示されます。</div>`;
      bar.hidden = false;
    }

    async function joinAsTeacher(event) {
      event.preventDefault();
      const input = document.getElementById('teacherJoinInput');
      const btn = document.getElementById('teacherJoinBtn');
      const error = document.getElementById('teacherJoinError');
      const code = input.value.trim();
      if (!code) { error.textContent = '先生コードを入力してください'; input.focus(); return; }
      btn.disabled = true;
      error.textContent = '';
      try {
        const res = await fetch('/api/school/join', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) { error.textContent = data.error || '入れませんでした'; btn.disabled = false; return; }
        await loadDashboard();
      } catch (e) {
        error.textContent = '通信に失敗しました。もう一度お試しください';
        btn.disabled = false;
      }
    }

    // ===== 運営アカウントの閲覧の記録 =====
    async function loadAccessLogs(offset) {
      const section = document.getElementById('accessLogSection');
      const wrap = document.getElementById('accessLogWrap');
      section.hidden = false;
      try {
        const res = await fetch(`/api/operator/access-logs?offset=${Number(offset)}`);
        const data = await res.json();
        if (!res.ok) { wrap.innerHTML = `<div class="loading">${escHtml(data.error || '読み込みに失敗しました')}</div>`; return; }
        if (offset === 0 && data.logs.length === 0) {
          wrap.innerHTML = '<div class="loading">まだ記録はありません</div>';
          return;
        }
        const rows = data.logs.map(l => {
          const who = l.student_name ? `${escHtml(l.student_name)}さん（#${Number(l.student_id)}${l.school_name ? '・' + escHtml(l.school_name) : ''}）の` : '';
          return `
            <div class="access-row">
              <span class="access-time">${formatDateTime(l.at)}</span>
              <span class="access-main">${escHtml(l.operator_name)}が ${who}${escHtml(l.action)}を見た
                <span class="access-sub">${escHtml(l.operator_email)}${l.target ? '・' + escHtml(l.target) : ''}</span>
              </span>
            </div>`;
        }).join('');
        const more = data.has_more
          ? `<div class="access-more"><button class="scope-btn" id="accessMoreBtn" type="button">もっと見る</button></div>` : '';
        if (offset === 0) {
          wrap.innerHTML = `<div class="access-log" id="accessLogList">${rows}</div>${more}`;
        } else {
          document.querySelector('.access-more')?.remove();
          document.getElementById('accessLogList').insertAdjacentHTML('beforeend', rows);
          wrap.insertAdjacentHTML('beforeend', more);
        }
        const moreBtn = document.getElementById('accessMoreBtn');
        if (moreBtn) moreBtn.addEventListener('click', () => loadAccessLogs(offset + data.logs.length));
      } catch (e) {
        wrap.innerHTML = '<div class="loading">読み込みに失敗しました</div>';
      }
    }

    // ===== 課題アサイン（1人〜複数人まとめて対応） =====
    function showAssignModal(students) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const subjectOptions = SUBJECTS.map(s => `<option value="${s}">${SUBJECT_EMOJIS[s]} ${s}</option>`).join('');
      const whoLabel = students.length === 1
        ? `${escHtml(students[0].name)} さん`
        : `選択した${students.length}人（${students.map(s => escHtml(s.name)).join('、')}）`;

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-title">課題を出す</div>
          <div class="modal-desc">${whoLabel}に課題を出します</div>
          <div>
            <label>科目</label>
            <select id="assignSubject">${subjectOptions}</select>
          </div>
          <div>
            <label>単元（任意）</label>
            <select id="assignUnit"><option value="">おまかせ（単元指定なし）</option></select>
          </div>
          <div id="assignError" style="font-size:14px; font-weight:700; color:var(--red); min-height:20px;"></div>
          <div style="display:flex; gap:8px;">
            <button class="modal-close modal-cancel" id="assignCancel">キャンセル</button>
            <button class="modal-close" id="assignConfirm">課題を出す</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const subjectSelect = document.getElementById('assignSubject');
      const unitSelect    = document.getElementById('assignUnit');

      function refreshUnitOptions() {
        const categories = Object.keys(UNIT_CURRICULUM[subjectSelect.value] || {});
        let options = '<option value="">おまかせ（単元指定なし）</option>';
        categories.forEach(cat => {
          const units = UNIT_CURRICULUM[subjectSelect.value][cat];
          options += `<optgroup label="${escHtml(cat)}">` +
            units.map(u => `<option value="${escHtml(u)}">${escHtml(u)}</option>`).join('') +
            `</optgroup>`;
        });
        unitSelect.innerHTML = options;
      }
      subjectSelect.addEventListener('change', refreshUnitOptions);
      refreshUnitOptions();

      document.getElementById('assignCancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      document.getElementById('assignConfirm').addEventListener('click', async () => {
        const btn = document.getElementById('assignConfirm');
        btn.disabled = true;
        const res = await fetch('/api/dashboard/assignments', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_ids: students.map(s => parseInt(s.id)),
            subject: subjectSelect.value,
            unit: unitSelect.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('assignError').textContent = data.error || 'エラーが発生しました';
          btn.disabled = false;
          return;
        }
        // アサイン済みの生徒は選択状態をクリアして一覧を再描画する
        students.forEach(s => selectedStudentIds.delete(String(s.id)));
        renderTable(allStudents);

        const unitLabel = unitSelect.value ? '・' + escHtml(unitSelect.value) : '';
        overlay.querySelector('.modal').innerHTML = `
          <div class="modal-title">課題を出しました</div>
          <div class="modal-desc">${whoLabel}に「${escHtml(subjectSelect.value)}${unitLabel}」を課題として出しました。</div>
          <button class="modal-close" id="assignDone">閉じる</button>
        `;
        document.getElementById('assignDone').addEventListener('click', () => overlay.remove());
      });
    }

    function showResetModal(studentId, studentName) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-title">パスワードリセット</div>
          <div class="modal-desc" id="modalDesc">${escHtml(studentName)} さんのパスワードをリセットしますか？</div>
          <div style="display:flex;gap:8px;">
            <button class="modal-close modal-cancel" id="modalCancel">キャンセル</button>
            <button class="modal-close" id="modalConfirm">リセットする</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('modalCancel').addEventListener('click', () => overlay.remove());

      document.getElementById('modalConfirm').addEventListener('click', async () => {
        document.getElementById('modalConfirm').disabled = true;
        document.getElementById('modalConfirm').textContent = '処理中...';

        const res  = await fetch('/api/dashboard/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student_id: parseInt(studentId) }),
        });
        const data = await res.json();

        if (!res.ok) {
          document.getElementById('modalDesc').textContent = data.error || 'エラーが発生しました';
          document.getElementById('modalConfirm').style.display = 'none';
          return;
        }

        overlay.querySelector('.modal').innerHTML = `
          <div class="modal-title">リセット完了</div>
          <div class="modal-desc">${escHtml(studentName)} さんの仮パスワードです。本人に伝えてください。</div>
          <div class="temp-pass">${data.temp_password}</div>
          <div class="modal-desc" style="font-size:12px;">次回ログイン後にパスワードを変更するよう伝えてください</div>
          <button class="modal-close" id="modalDone">閉じる</button>
        `;
        document.getElementById('modalDone').addEventListener('click', () => overlay.remove());
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    document.getElementById('bulkAssignBtn').addEventListener('click', () => {
      const students = allStudents
        .filter(s => selectedStudentIds.has(String(s.id)))
        .map(s => ({ id: s.id, name: s.name }));
      if (students.length > 0) showAssignModal(students);
    });

    init();
  </script>
</body>
