<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feyn - ログイン</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F3F8FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131A16" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feyn">
  <script>
    // ちらつき防止のため、描画前に保存済みテーマを適用する
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('feynTheme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <link rel="stylesheet" href="/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ログイン・新規登録。ルールは docs/DESIGN.md、色・角・影のトークンは theme.css */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      font-weight: 500;
      color: var(--ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 72px 16px 32px;
      /* LPのファーストビューと同じ、うっすら方眼 */
      background-color: var(--paper-2);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .theme-toggle {
      position: fixed; top: 16px; right: 16px;
      min-height: 40px; padding: 4px 16px;
      border: 1px solid var(--rule); border-radius: var(--r-md);
      background: var(--paper); color: var(--ink);
      font-size: 14px; font-weight: 700;
    }
    .theme-toggle:hover { border-color: var(--ink); }

    .card {
      width: 400px; max-width: 100%;
      display: flex; flex-direction: column; gap: 16px;
      padding: 32px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-paper);
    }
    .logo { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
    .logo-mark { width: 36px; height: 36px; border-radius: var(--r-md); background: var(--brand); display: grid; place-items: center; }
    .logo-mark svg { width: 22px; height: 22px; }
    .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; }
    .title { text-align: center; font-size: 20px; font-weight: 900; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
    .desc { text-align: center; font-size: 14px; color: var(--ink-soft); margin-top: -8px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
    .field input, .field select {
      width: 100%; min-height: 48px; padding: 8px 12px;
      border: 1px solid var(--rule); border-radius: var(--r-sm);
      background: var(--paper); color: var(--ink);
      font-size: 16px;      /* 16px未満だとiOSがフォーカス時に拡大する */
    }
    .field input::placeholder { color: var(--ink-soft); opacity: 0.7; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--grid-line); }

    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 48px; }
    .eye-btn {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; display: grid; place-items: center;
      border: none; background: none; color: var(--ink-soft);
    }
    .eye-btn svg { width: 20px; height: 20px; }
    .eye-btn:hover { color: var(--ink); }

    .question-box {
      padding: 12px; border-radius: var(--r-sm);
      background: var(--paper-2); border-left: 3px solid var(--red);
      font-size: 16px; font-weight: 700;
    }

    .error { min-height: 20px; font-size: 14px; font-weight: 700; color: var(--red); text-align: center; }
    .success {
      padding: 12px; border-radius: var(--r-sm);
      background: var(--answer-bg); color: var(--ink);
      font-size: 14px; font-weight: 700; text-align: center; line-height: 1.6;
    }

    .submit-btn {
      width: 100%; min-height: 52px;
      border: none; border-radius: var(--r-md);
      background: var(--red); color: var(--on-red);
      font-size: 18px; font-weight: 900;
      box-shadow: var(--shadow-press);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .submit-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dark); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .toggle { text-align: center; font-size: 14px; color: var(--ink-soft); }
    .toggle-link {
      border: none; background: none; padding: 4px;
      color: var(--ink); font-size: 14px; font-weight: 900;
      text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 4px;
    }
    .link-btn {
      align-self: center; min-height: 36px; padding: 4px 8px;
      border: none; background: none;
      font-size: 14px; font-weight: 700; color: var(--ink-soft); text-decoration: underline;
    }
    .link-btn:hover { color: var(--ink); }

    @media (max-width: 440px) {
      body { padding-top: 64px; align-items: flex-start; }
      .card { padding: 24px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .submit-btn { transition: none; } }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">ダークモード</button>
  <div class="card">
    <a class="logo" href="/landing" aria-label="Feyn トップ"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5L12 14z" fill="#FFFFFF"/><path d="M6.5 11.6V16c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.4L12 14z" fill="#FFFFFF"/></svg></span><span class="logo-text">Feyn</span></a>
    <h1 class="title" id="formTitle">ログイン</h1>
    <div class="desc" id="formDesc">Feynにわかるように教えよう！</div>

    <!-- メールアドレス -->
    <div class="field" id="emailField">
      <label>メールアドレス</label>
      <input type="email" id="emailInput" placeholder="example@email.com" autocomplete="email">
    </div>

    <!-- ニックネーム（新規登録のみ） -->
    <div class="field" id="nameField" style="display:none">
      <label>ニックネーム（Feynが呼ぶ名前）</label>
      <input type="text" id="nameInput" placeholder="例: たかひろ" maxlength="20" autocomplete="nickname">
    </div>

    <!-- パスワード（ログイン・新規登録） -->
    <div class="field" id="passwordField">
      <label>パスワード</label>
      <div class="pass-wrap">
        <input type="password" id="passwordInput" placeholder="8文字以上" autocomplete="current-password">
        <button type="button" class="eye-btn" id="eyeBtn" aria-label="パスワードを表示する"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <!-- 先生コード（新規登録のみ） -->
    <div class="field" id="teacherCodeField" style="display:none">
      <label>先生コード（任意）</label>
      <input type="text" id="teacherCodeInput" placeholder="先生の場合のみ入力" autocomplete="off">
    </div>

    <!-- 秘密の質問（新規登録のみ） -->
    <div class="field" id="securityQuestionField" style="display:none">
      <label>秘密の質問</label>
      <select id="securityQuestionSelect">
        <option value="">-- 選んでください --</option>
        <option>小学校の名前は？</option>
        <option>初めて飼ったペットの名前は？</option>
        <option>好きな食べ物は？</option>
        <option>生まれた市区町村は？</option>
        <option>母親の旧姓は？</option>
      </select>
    </div>

    <!-- 秘密の質問の答え（新規登録のみ） -->
    <div class="field" id="securityAnswerField" style="display:none">
      <label>答え</label>
      <input type="text" id="securityAnswerInput" placeholder="パスワードリセット時に使います" autocomplete="off">
    </div>

    <!-- 質問表示（パスワードリセット step2） -->
    <div class="field" id="questionDisplayField" style="display:none">
      <label>あなたの秘密の質問</label>
      <div class="question-box" id="questionDisplay"></div>
    </div>

    <!-- 答え入力（パスワードリセット step2） -->
    <div class="field" id="forgotAnswerField" style="display:none">
      <label>答え</label>
      <input type="text" id="forgotAnswerInput" placeholder="登録時の答えを入力" autocomplete="off">
    </div>

    <!-- 新しいパスワード（パスワードリセット step2） -->
    <div class="field" id="newPasswordField" style="display:none">
      <label>新しいパスワード</label>
      <input type="password" id="newPasswordInput" placeholder="8文字以上" autocomplete="new-password">
    </div>

    <div class="error"   id="errorMsg"></div>
    <div class="success" id="successMsg" style="display:none"></div>

    <button class="submit-btn" id="submitBtn">ログイン</button>

    <!-- 「ログインに戻る」（パスワードリセット時） -->
    <button class="link-btn" id="backBtn" type="button" style="display:none">ログインに戻る</button>

    <!-- ログイン ↔ 新規登録 トグル -->
    <div class="toggle" id="toggleArea">
      <span id="toggleDesc">アカウントがない？</span>
      <button class="toggle-link" id="toggleLink" type="button">新規登録はこちら</button>
    </div>

    <!-- パスワードを忘れた（ログイン時のみ） -->
    <button class="link-btn" id="forgotBtn" type="button">パスワードを忘れた方はこちら</button>
  </div>

  <script>
    // ===== テーマ切り替え =====
    const themeToggle = document.getElementById('themeToggle');

    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeToggle.textContent = isDark ? 'ライトモード' : 'ダークモード';
    }
    updateThemeLabel();

    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('feynTheme', next);
      updateThemeLabel();
    });

    // mode: 'login' | 'signup' | 'forgot1' | 'forgot2'
    let mode        = 'login';
    let forgotEmail = '';

    const els = {
      title:                document.getElementById('formTitle'),
      desc:                 document.getElementById('formDesc'),
      submitBtn:            document.getElementById('submitBtn'),
      errorMsg:             document.getElementById('errorMsg'),
      successMsg:           document.getElementById('successMsg'),
      emailField:           document.getElementById('emailField'),
      emailInput:           document.getElementById('emailInput'),
      nameField:            document.getElementById('nameField'),
      nameInput:            document.getElementById('nameInput'),
      passwordField:        document.getElementById('passwordField'),
      passwordInput:        document.getElementById('passwordInput'),
      eyeBtn:               document.getElementById('eyeBtn'),
      teacherCodeField:     document.getElementById('teacherCodeField'),
      teacherCodeInput:     document.getElementById('teacherCodeInput'),
      securityQuestionField: document.getElementById('securityQuestionField'),
      securityQuestionSelect: document.getElementById('securityQuestionSelect'),
      securityAnswerField:  document.getElementById('securityAnswerField'),
      securityAnswerInput:  document.getElementById('securityAnswerInput'),
      questionDisplayField: document.getElementById('questionDisplayField'),
      questionDisplay:      document.getElementById('questionDisplay'),
      forgotAnswerField:    document.getElementById('forgotAnswerField'),
      forgotAnswerInput:    document.getElementById('forgotAnswerInput'),
      newPasswordField:     document.getElementById('newPasswordField'),
      newPasswordInput:     document.getElementById('newPasswordInput'),
      backBtn:              document.getElementById('backBtn'),
      toggleArea:           document.getElementById('toggleArea'),
      toggleDesc:           document.getElementById('toggleDesc'),
      toggleLink:           document.getElementById('toggleLink'),
      forgotBtn:            document.getElementById('forgotBtn'),
    };

    function show(el) { el.style.display = 'flex'; }
    function hide(el) { el.style.display = 'none'; }
    function clearMsgs() {
      els.errorMsg.textContent = '';
      els.successMsg.style.display = 'none';
      els.successMsg.textContent   = '';
    }

    function setMode(newMode) {
      mode = newMode;
      clearMsgs();

      const isLogin   = mode === 'login';
      const isSignup  = mode === 'signup';
      const isForgot1 = mode === 'forgot1';
      const isForgot2 = mode === 'forgot2';

      // email: login, signup, forgot1
      els.emailField.style.display  = (isLogin || isSignup || isForgot1) ? 'flex' : 'none';
      // password: login, signup
      els.passwordField.style.display = (isLogin || isSignup) ? 'flex' : 'none';
      // signup-only
      els.nameField.style.display            = isSignup ? 'flex' : 'none';
      els.teacherCodeField.style.display     = isSignup ? 'flex' : 'none';
      els.securityQuestionField.style.display = isSignup ? 'flex' : 'none';
      els.securityAnswerField.style.display  = isSignup ? 'flex' : 'none';
      // forgot2-only
      els.questionDisplayField.style.display = isForgot2 ? 'flex' : 'none';
      els.forgotAnswerField.style.display    = isForgot2 ? 'flex' : 'none';
      els.newPasswordField.style.display     = isForgot2 ? 'flex' : 'none';
      // nav
      els.backBtn.style.display    = (isForgot1 || isForgot2) ? 'block' : 'none';
      els.toggleArea.style.display = (isLogin || isSignup)    ? 'block' : 'none';
      els.forgotBtn.style.display  = isLogin                   ? 'block' : 'none';

      // titles
      const titles   = { login: 'ログイン', signup: '新規登録', forgot1: 'パスワードをリセット', forgot2: 'パスワードをリセット' };
      const descs    = { login: 'Feynにわかるように教えよう！', signup: 'アカウントを作って学習を始めよう', forgot1: '登録したメールアドレスを入力してください', forgot2: '秘密の質問に答えて新しいパスワードを設定してください' };
      const btnTexts = { login: 'ログイン', signup: 'アカウントを作る', forgot1: '次へ', forgot2: 'リセットする' };
      els.title.textContent     = titles[mode];
      els.desc.textContent      = descs[mode];
      els.submitBtn.textContent = btnTexts[mode];

      els.passwordInput.setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');

      if (isLogin) {
        els.toggleDesc.textContent = 'アカウントがない？';
        els.toggleLink.textContent = '新規登録はこちら';
      } else if (isSignup) {
        els.toggleDesc.textContent = 'すでにアカウントがある？';
        els.toggleLink.textContent = 'ログインはこちら';
      }
    }

    // ===== パスワード表示/非表示 =====
    els.eyeBtn.addEventListener('click', () => {
      const hidden = els.passwordInput.type === 'password';
      els.passwordInput.type  = hidden ? 'text' : 'password';
      els.eyeBtn.style.opacity = hidden ? '1' : '0.5';
      els.eyeBtn.setAttribute('aria-label', hidden ? 'パスワードを隠す' : 'パスワードを表示する');   // 押したあとの状態に合わせる
    });

    // ===== トグル（ログイン ↔ 新規登録） =====
    els.toggleLink.addEventListener('click', () => {
      setMode(mode === 'login' ? 'signup' : 'login');
    });

    // ===== パスワードを忘れた =====
    els.forgotBtn.addEventListener('click', () => setMode('forgot1'));
    els.backBtn.addEventListener('click', () => setMode('login'));

    // ===== 送信処理 =====
    async function submit() {
      clearMsgs();
      els.submitBtn.disabled = true;

      try {
        if (mode === 'login')   await doLogin();
        if (mode === 'signup')  await doSignup();
        if (mode === 'forgot1') await doForgot1();
        if (mode === 'forgot2') await doForgot2();
      } finally {
        els.submitBtn.disabled = false;
      }
    }

    async function doLogin() {
      const email    = els.emailInput.value.trim();
      const password = els.passwordInput.value;
      if (!email || !password) { els.errorMsg.textContent = 'メールアドレスとパスワードを入力してください'; return; }

      const res  = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      const data = await res.json();
      if (!res.ok) { els.errorMsg.textContent = data.error || 'エラーが発生しました'; return; }
      window.location.href = '/';
    }

    async function doSignup() {
      const email           = els.emailInput.value.trim();
      const name            = els.nameInput.value.trim();
      const password        = els.passwordInput.value;
      const teacher_code    = els.teacherCodeInput.value.trim();
      const security_question = els.securityQuestionSelect.value;
      const security_answer   = els.securityAnswerInput.value.trim();

      if (!email || !name || !password)        { els.errorMsg.textContent = 'すべての項目を入力してください'; return; }
      if (!security_question)                   { els.errorMsg.textContent = '秘密の質問を選んでください'; return; }
      if (!security_answer)                     { els.errorMsg.textContent = '秘密の質問の答えを入力してください'; return; }

      const res  = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, name, password, teacher_code, security_question, security_answer }) });
      const data = await res.json();
      if (!res.ok) { els.errorMsg.textContent = data.error || 'エラーが発生しました'; return; }
      window.location.href = '/';
    }

    async function doForgot1() {
      const email = els.emailInput.value.trim();
      if (!email) { els.errorMsg.textContent = 'メールアドレスを入力してください'; return; }

      const res  = await fetch('/api/security-question', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const data = await res.json();
      if (!res.ok) { els.errorMsg.textContent = data.error || 'エラーが発生しました'; return; }

      forgotEmail = email;
      els.questionDisplay.textContent = data.question;
      setMode('forgot2');
    }

    async function doForgot2() {
      const answer       = els.forgotAnswerInput.value.trim();
      const new_password = els.newPasswordInput.value;
      if (!answer)        { els.errorMsg.textContent = '答えを入力してください'; return; }
      if (!new_password)  { els.errorMsg.textContent = '新しいパスワードを入力してください'; return; }

      const res  = await fetch('/api/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: forgotEmail, answer, new_password }) });
      const data = await res.json();
      if (!res.ok) { els.errorMsg.textContent = data.error || 'エラーが発生しました'; return; }

      els.successMsg.textContent   = 'パスワードをリセットしました！';
      els.successMsg.style.display = 'block';
      setTimeout(() => setMode('login'), 1500);
    }

    // ===== Enterキー =====
    els.submitBtn.addEventListener('click', submit);
    els.emailInput.addEventListener('keydown',    (e) => { if (e.key === 'Enter') { mode === 'signup' ? els.nameInput.focus() : (mode === 'forgot1' ? submit() : els.passwordInput.focus()); } });
    els.nameInput.addEventListener('keydown',     (e) => { if (e.key === 'Enter') els.passwordInput.focus(); });
    els.passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    els.forgotAnswerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.newPasswordInput.focus(); });
    els.newPasswordInput.addEventListener('keydown',  (e) => { if (e.key === 'Enter') submit(); });

    // ===== LPの「無料で始める」から来たときは、最初から新規登録の画面にする（/login?signup=1） =====
    if (new URLSearchParams(location.search).get('signup') === '1') {
      setMode('signup');
      history.replaceState(null, '', '/login');
    }

    // ===== 30分無操作による自動ログアウトからの遷移なら案内を出す =====
    if (new URLSearchParams(location.search).get('timeout') === '1') {
      els.successMsg.textContent   = 'しばらく操作がなかったため、自動的にログアウトしました。';
      els.successMsg.style.display = 'block';
      history.replaceState(null, '', '/login');
    }
  </script>
</body>
</html>
